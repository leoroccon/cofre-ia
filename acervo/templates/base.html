{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Cofre{% endblock %} · Cofre de IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400..700&display=swap">
  <link rel="stylesheet" href="{% static 'acervo/estilo.css' %}">
  <script src="{% static 'acervo/vida.js' %}" defer></script>
</head>
<body class="tema-{{ tema }}" data-cena="{% static 'acervo/caminhos.svg' %}">
  <header class="topo">
    <a class="marca" href="{% url 'inicio' %}"><span class="ponto"></span>Cofre de IA</a>
    {% if user.is_authenticated %}
    <nav>
      <a href="{% url 'lista' 'prompts' %}">Prompts</a>
      <a href="{% url 'lista' 'ideias' %}">Ideias</a>
      <a href="{% url 'lista' 'links' %}">Links</a>
      <a href="{% url 'lista' 'videos' %}">Vídeos</a>
    </nav>
    <form method="post" action="{% url 'logout' %}" class="sair">
      {% csrf_token %}
      <a class="usuario" href="{% url 'conta' %}" title="Minha conta">{{ user.get_username }}</a>
      <button type="submit" class="btn btn-fantasma">Sair</button>
    </form>
    {% endif %}
  </header>
  <main class="conteudo">
    {% for m in messages %}<div class="aviso">{{ m }}</div>{% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
