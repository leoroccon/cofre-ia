{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="entrada">
<h1 class="hero" data-letras>Cofre de IA</h1>
<section class="cartao login">
  <h1>Entrar</h1>
  <p class="suave">Acesso restrito.</p>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p class="erro">Usuário ou senha incorretos.</p>{% endif %}
    <label for="id_username">Usuário</label>
    <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
    <label for="id_password">Senha</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn">Entrar</button>
  </form>
</section>
</div>
{% endblock %}
